# Descarga los datos del Google Sheet, los sanitiza y publica el dashboard en GitHub Pages.
# Corre cada hora de 6:00 a 20:00 de Guatemala, al hacer push a main y a mano desde la
# pestaña Actions (workflow_dispatch).
# Antes corría una vez al día "a las 6:00", pero GitHub retrasa los horarios en punto: de verdad
# corría entre las 9:20 y las 15:00, y lo que RRHH cerraba en el sheet no salía en el sitio hasta
# el día siguiente (el sitio mostraba más vacantes abiertas que el sheet; Oscar, 2026-10-14).
# El minuto 17 evita la hora en punto, que es cuando GitHub más retrasa.
name: Actualizar datos y publicar

on:
  schedule:
    - cron: '17 12-23,0-2 * * *' # cada hora, 6:17 a 20:17 Guatemala (UTC-6)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Descargar y sanitizar datos (aborta si detecta datos personales)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/actualizar_datos.mjs

      - name: Validar el modelo de costo contra los valores de control
        run: node scripts/validar_modelo.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
